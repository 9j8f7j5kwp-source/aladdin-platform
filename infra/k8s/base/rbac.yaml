# Service Account for platform services
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aladdin-service-account
  namespace: aladdin-platform
  labels:
    app: aladdin-platform
---
# Cluster Role for service operations
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aladdin-service-role
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create"]
---
# Cluster Role Binding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aladdin-service-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aladdin-service-role
subjects:
  - kind: ServiceAccount
    name: aladdin-service-account
    namespace: aladdin-platform
