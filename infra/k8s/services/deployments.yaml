# Phase 2: Service Deployments
# All microservices for the Aladdin Platform

---
# Portfolio Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-service
  namespace: aladdin-platform
  labels:
    app: portfolio-service
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: portfolio-service
  template:
    metadata:
      labels:
        app: portfolio-service
    spec:
      serviceAccountName: aladdin-service-account
      containers:
      - name: portfolio-service
        image: ghcr.io/aladdin-platform/portfolio-service:latest
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: grpc
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: production
        - name: DB_HOST
          value: postgres-service
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka-service:9092
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-service
  namespace: aladdin-platform
spec:
  selector:
    app: portfolio-service
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: grpc
    port: 9090
    targetPort: 9090
  type: ClusterIP

---
# Risk Engine Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-engine
  namespace: aladdin-platform
  labels:
    app: risk-engine
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: risk-engine
  template:
    metadata:
      labels:
        app: risk-engine
    spec:
      serviceAccountName: aladdin-service-account
      containers:
      - name: risk-engine
        image: ghcr.io/aladdin-platform/risk-engine:latest
        ports:
        - containerPort: 8081
          name: http
        - containerPort: 9091
          name: grpc
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: production
        - name: DB_HOST
          value: postgres-service
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka-service:9092
