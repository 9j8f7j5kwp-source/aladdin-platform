---
# OMS Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oms-service
  namespace: aladdin-platform
  labels:
    app: oms-service
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: oms-service
  template:
    metadata:
      labels:
        app: oms-service
    spec:
      serviceAccountName: aladdin-service-account
      containers:
      - name: oms-service
        image: ghcr.io/aladdin-platform/oms-service:latest
        ports:
        - containerPort: 8082
          name: http
        - containerPort: 9092
          name: grpc
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: production
        - name: DB_HOST
          value: postgres-service
        - name: REDIS_HOST
          value: redis-service
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka-service:9092
        - name: FIX_CONFIG_PATH
          value: /config/fix
        volumeMounts:
        - name: fix-config
          mountPath: /config/fix
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8082
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 5
      volumes:
      - name: fix-config
        configMap:
          name: fix-config
---
apiVersion: v1
kind: Service
metadata:
  name: oms-service
  namespace: aladdin-platform
spec:
  selector:
    app: oms-service
  ports:
  - name: http
    port: 8082
    targetPort: 8082
  - name: grpc
    port: 9092
    targetPort: 9092
  type: ClusterIP

---
# Market Data Service (C++ Engine)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data-cpp
  namespace: aladdin-platform
  labels:
    app: market-data-cpp
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: market-data-cpp
  template:
    metadata:
      labels:
        app: market-data-cpp
    spec:
      serviceAccountName: aladdin-service-account
      containers:
      - name: market-data-cpp
        image: ghcr.io/aladdin-platform/market-data-cpp:latest
        ports:
        - containerPort: 50051
          name: grpc
        env:
        - name: KAFKA_BROKERS
          value: kafka-service:9092
        - name: REDIS_HOST
          value: redis-service
        - name: IEX_API_KEY
          valueFrom:
            secretKeyRef:
              name: market-data-secrets
              key: iex-api-key
        - name: POLYGON_API_KEY
          valueFrom:
            secretKeyRef:
              name: market-data-secrets
              key: polygon-api-key
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        livenessProbe:
          exec:
            command: ["grpc_health_probe", "-addr=:50051"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["grpc_health_probe", "-addr=:50051"]
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: market-data-service
  namespace: aladdin-platform
spec:
  selector:
    app: market-data-cpp
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
  type: ClusterIP

---
# Market Data Service (Python Analytics)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data-python
  namespace: aladdin-platform
  labels:
    app: market-data-python
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: market-data-python
  template:
    metadata:
      labels:
        app: market-data-python
    spec:
      serviceAccountName: aladdin-service-account
      containers:
      - name: market-data-python
        image: ghcr.io/aladdin-platform/market-data-python:latest
        ports:
        - containerPort: 8084
          name: http
        - containerPort: 8085
          name: ws
        env:
        - name: TIMESCALE_HOST
          value: timescaledb-service
        - name: REDIS_HOST
          value: redis-service
        - name: GRPC_CPP_ENDPOINT
          value: market-data-service:50051
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8084
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8084
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: market-data-python
  namespace: aladdin-platform
spec:
  selector:
    app: market-data-python
  ports:
  - name: http
    port: 8084
    targetPort: 8084
  - name: ws
    port: 8085
    targetPort: 8085
  type: ClusterIP

---
# Redis Cache
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: aladdin-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: aladdin-platform
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP
